[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpn-star-scores"
version = "0.1.0"
description = "Validation and publication workflows for GPN-Star genome-wide scores"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "huggingface-hub",
    "numpy",
    "polars",
    "pyarrow",
    "pybigwig",
    "snakemake>=9.23,<10",
    "snakemake-executor-plugin-slurm",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.15",
    "snakefmt>=2.0.3",
]

[tool.uv]
required-version = ">=0.9.5,<0.10"

[tool.hatch.build.targets.wheel]
packages = ["src/gpn_star_scores"]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: network, cluster, production-data, or otherwise slow tests excluded from pre-commit",
]
