scratch_root: scratch

resource_policy:
  heavy_initial:
    threads: 4
    mem_mb: 4096
    runtime: 240
    disk_mb: 1024
  pilot_tuning:
    runtime_multiplier: 2.0
    runtime_min: 30
    runtime_max: 360
    memory_multiplier: 1.5
    memory_min_mb: 4096

scf_smoke:
  chromosomes:
    - chr1
    - chr22

inventory:
  # Keep the production workflow opt-in so the default local dry-run remains
  # hermetic. Override this file with an SCF-specific config after staging.
  enabled: false
  source_root: null
  output_root: results/inventory
  batch_size: 1048576
  expected_shard_bytes: null
  reference_fastas: {}
  hugging_face_capacity:
    organization: songlab
    confirmed: false
    evidence: null
    confirmed_by: null
    confirmed_at: null
    current_storage_bytes: null
    planned_release_bytes: null
    reserved_headroom_bytes: null
    approved_capacity_bytes: null
  # Populate all resource values from the smallest representative SCF pilot
  # before enabling the production workflow.
  resources:
    prepare_reference:
      mem_mb: null
      runtime: null
      tmp_disk_mb: null
    validate_shard:
      mem_mb: null
      runtime: null
      tmp_disk_mb: null
    manifest:
      mem_mb: null
      runtime: null
      tmp_disk_mb: null

parquet_benchmark:
  # Production benchmarking is gated on issue #8's complete valid-shard
  # inventory manifest and an issue-specific epurdom pilot using the committed
  # SCF profile. Release-level capacity blockers remain separately visible.
  enabled: false
  source_root: null
  output_root: results/parquet-benchmark
  cases: []
  remote_uris: {}
  inventory_manifest: null
  staging_checks: null
  sparse_key_count: 1024
  hf_block_size: 4194304
  # Populate these from the smallest representative epurdom pilot before
  # enabling the workflow. Values are portable MB/minute requests.
  resources:
    rewrite:
      mem_mb: null
      runtime: null
      disk_mb: null
    benchmark:
      mem_mb: null
      runtime: null
      disk_mb: null
    report:
      mem_mb: null
      runtime: null
      disk_mb: null

bigwig:
  # Keep production tracks opt-in. Enable only with finalized issue #8 and #5
  # evidence and resource values from the issue #7 epurdom pilot.
  enabled: false
  source_root: null
  output_root: results/bigwig
  inventory_manifest: null
  parquet_selection: null
  selection_report: null
  batch_size: 262144
  sample_count: 1024
  value_decimals: 3
  benchmark:
    enabled: false
    output_root: results/bigwig-benchmark
    repetitions: 5
    cases: []
  resources:
    benchmark:
      mem_mb: null
      runtime: null
      disk_mb: null
    report:
      mem_mb: null
      runtime: null
      disk_mb: null
    build_chromosome:
      mem_mb: null
      runtime: null
      disk_mb: null
    concatenate:
      mem_mb: null
      runtime: null
      disk_mb: null
    audit:
      mem_mb: null
      runtime: null
      disk_mb: null
    aggregate:
      mem_mb: null
      runtime: null
      disk_mb: null
raw_llr:
  # Issue #15 is an additive post-v1 workflow. It reads the immutable LLR
  # Parquet shards and the accepted issue #7 method-selection report but never
  # rebuilds or validates the existing 40 BigWigs.
  enabled: false
  source_root: null
  output_root: results/raw-llr
  inventory_manifest: null
  parquet_selection: null
  track_selection: null
  batch_size: 262144
  sample_count: 1024
  value_decimals: 3
  # Remote publication is a separate local target. Populate these only after
  # the 32-file byte total and candidate digest have been generated and the
  # exact issue #15 approval has been recorded.
  expected_base_revision: null
  publication_approval: null
  resources:
    build_chromosome:
      mem_mb: null
      runtime: null
      disk_mb: null
    concatenate:
      mem_mb: null
      runtime: null
      disk_mb: null
    audit:
      mem_mb: null
      runtime: null
      disk_mb: null
    aggregate:
      mem_mb: null
      runtime: null
      disk_mb: null
    publish:
      mem_mb: null
      runtime: null
      disk_mb: null

release:
  # Public publication is an explicit local target. It remains disabled for
  # hermetic development and must never be submitted through the SCF profile.
  enabled: false
  source_root: null
  bigwig_root: null
  inventory_manifest: null
  parquet_selection: null
  bigwig_validation: null
  output_root: results/release
  # Viewer readiness is reported but does not block publication by default.
  viewer_attempts: 1
  viewer_retry_seconds: 0
  viewer_required: false
  hf_block_size: 4194304
  capacity_approval: null
  resources:
    preflight:
      mem_mb: null
      runtime: null
      disk_mb: null
    publish:
      mem_mb: null
      runtime: null
      disk_mb: null

hub:
  # The issue #6 hub is built and validated locally against the immutable
  # public BigWigs. Public publication is a separate approval-gated target.
  enabled: false
  # Set only for a metadata-only follow-up that must reuse completed BigWig
  # evidence and skip all BigWig requests during local and public validation.
  metadata_only_update: false
  release_manifest: null
  # The immutable v1 artifact revision remains the source of logo tracks and
  # retained entropy artifacts; entropy remains in the release catalog but is
  # not referenced by the hub.
  artifact_revision: null
  raw_llr_validation: null
  raw_llr_artifact_revision: null
  # Exact gpn-star-scores commit that rendered an extended dataset card.
  source_revision: null
  expected_base_revision: null
  contact_email: null
  output_root: results/hub
  # Use durable shared project scratch for hubCheck's UDC cache on SCF.
  udc_cache_root: null
  publication_approval: null
  resources:
    build:
      mem_mb: null
      runtime: null
      disk_mb: null
    validate:
      mem_mb: null
      runtime: null
      disk_mb: null
    publish:
      mem_mb: null
      runtime: null
      disk_mb: null

qa:
  # End-to-end public QA is opt-in and never creates a tag by itself.
  enabled: false
  release_metadata_root: null
  hub_metadata_root: null
  release_revision: null
  hub_revision: null
  public_hub_report: null
  workflow_commit: null
  udc_cache_root: null
  scf_evidence: reports/scf-smoke-pilot.json
  bigwig_evidence: reports/bigwig-benchmark-pilot/summary.json
  hub_evidence: reports/ucsc-track-hub-preflight/summary.json
  viewer_attempts: 1
  viewer_retry_seconds: 0
  hf_block_size: 4194304
  known_limitations: []
  waivers: []
  tag_approval: null
  resources:
    release: {mem_mb: null, runtime: null, disk_mb: null}
    hub: {mem_mb: null, runtime: null, disk_mb: null}
    record: {mem_mb: null, runtime: null, disk_mb: null}
