hub:
  enabled: true
  # Set true only for a presentation-only follow-up whose completed BigWig
  # evidence must be reused without any BigWig request.
  metadata_only_update: false
  release_manifest: /shared/project/scratch/gpn-star-scores/release/metadata/manifest/release.json
  artifact_revision: 5c799b2ec6aa089f0caa8294ae72adb4510f81ae
  # Add both fields after the 32 raw-LLR BigWigs have been published. Existing
  # entropy/logo URLs remain pinned to artifact_revision above.
  raw_llr_validation: /shared/project/scratch/gpn-star-scores/raw-llr/validation.json
  raw_llr_artifact_revision: RAW_LLR_ARTIFACT_COMMIT_SHA
  expected_base_revision: 340a04b4ccc95d68ad3be4fc3b08d725f29842e4
  contact_email: gbenegas@berkeley.edu
  output_root: /shared/project/scratch/gpn-star-scores/hub
  udc_cache_root: /shared/project/scratch/gpn-star-scores/ucsc-udc-cache

  # Leave this null while building. Immediately before a public update, record
  # the author's explicit approval on the owning issue and copy the exact
  # evidence here. Issue #15 owns the raw-LLR hub update. The publisher
  # rejects a changed remote base. Use publish_dataset_card for README-only
  # updates; reserve publish_hub for hub or track changes.
  publication_approval: null
  # publication_approval:
  #   approved: true
  #   evidence_url: https://github.com/gonzalobenegas/gpn-star-scores/issues/2
  #   approved_by: gonzalobenegas
  #   approved_at: "YYYY-MM-DD"
  #   expected_base_revision: 340a04b4ccc95d68ad3be4fc3b08d725f29842e4
  #   operation: publish_dataset_card
  #   # README SHA-256 for publish_dataset_card; aggregate publication digest
  #   # from publication_candidate_sha256() for publish_hub.
  #   candidate_sha256: 64_CHARACTER_GENERATED_README_SHA256

  resources:
    # Measured issue #6 local preflight: build 2.07 s / 114.3 MiB peak RSS;
    # cold-cache validation 7m06s / 116.1 MiB peak RSS. Requests include margin.
    build: {mem_mb: 1024, runtime: 5, disk_mb: 1024}
    validate: {mem_mb: 1024, runtime: 15, disk_mb: 1024}
    # Publication runs locally and never through the SCF profile.
    publish: {mem_mb: 1024, runtime: 20, disk_mb: 1024}
